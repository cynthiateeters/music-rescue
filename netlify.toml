# Music Rescue proof of concept. The models aren't in the repo, so a build linked to GitHub
# downloads them first (about 244 MB, checked against homr-web's pinned hashes), then builds.
[build]
  command = "node scripts/fetch-models.mjs && pnpm build"
  publish = "dist"

# The security policy tested under vite preview (vite.config.js, MUSIC_POLICY): Deck Rescue's
# policy plus 'wasm-unsafe-eval' and 'unsafe-eval', which homr-web needs. The two
# Cross-Origin headers let WebAssembly use threads. Keep this in sync with vite.config.js and
# public/_headers, which carries the same headers for a drag-and-drop deploy of dist.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' blob:; worker-src 'self'; style-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Netlify sends this header on a 404 too, so a long cache would keep a missing model broken
# in a visitor's browser long after a fixed deploy. An hour caps that, and after it the browser
# rechecks the ETag, which costs a quick 304, not a fresh download. homr-web also keeps the
# models in its own Cache Storage, so returning visitors rarely ask at all.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
